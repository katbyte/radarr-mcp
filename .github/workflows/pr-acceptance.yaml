---
name: tests
on:
  push:
    branches: [ 'main' ]
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'vendor/**'
      - 'makefile'
      - '.scripts/testenv.sh'
      - 'acceptance/**'
      - 'lib/testenv/**'
      # sdk/pandorest's tests re-import the spec and regenerate the SDK,
      # failing when api-defs/ or sdk/radarr are stale
      - 'api-defs/**'
      - '.github/workflows/pr-acceptance.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # the unit tests need no server: the tools against a canned one, and the
  # parsers, scoring and SDK generation on their own
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./.go-version
      - run: make test

  # one job per suite, so a failure names which layer broke: the client's
  # view of the API, or the tools' behaviour on top of it
  sdk:
    name: acceptance (sdk/radarr against a real Radarr)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./.go-version

      # ffmpeg generates the fixture videos and openssl mints the provider
      # proxy's CA. ffmpeg is not on the runner image, so install it rather
      # than assume it is there.
      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg openssl curl docker

      # make owns the container lifecycle, so CI runs exactly what a
      # developer runs rather than a second copy of the same steps. Metadata
      # calls replay from the committed cassettes, so this needs no network
      # beyond the container image.
      - name: Run the SDK suite
        run: make testacc-sdk

      - name: Tear down
        if: always()
        run: |
          RADARR_TEST_CONTAINER=radarr-mcp-sdk \
            RADARR_TEST_DATA="$HOME/.cache/radarr-mcp/testenv/sdk" \
            .scripts/testenv.sh down || true

  tools:
    name: acceptance (the tools against a real Radarr)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./.go-version

      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg openssl curl docker

      - name: Run the tool suite
        run: make testacc-tools

      - name: Tear down
        if: always()
        run: |
          RADARR_TEST_CONTAINER=radarr-mcp-tools \
            RADARR_TEST_DATA="$HOME/.cache/radarr-mcp/testenv/tools" \
            .scripts/testenv.sh down || true
